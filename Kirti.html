<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Variable re-declared</h1>
    <p>var will not loose it's value after re-declaring</p>
    <p id="demo"></p>
    <p id="hello"></p>
    <script>
        var a = 30;
        let x = 2 + 3 + "5";
        {
            a = 100;
            let x = 50;
        }
        // let x = 20;   // give compile time error
        // document.writeln(a);
        document.getElementById("demo").innerHTML = `x = ${x}`; // print before a
        document.getElementById("hello").innerHTML = `a = ${a}`; // a = 50

    </script>
</body>

</html>
