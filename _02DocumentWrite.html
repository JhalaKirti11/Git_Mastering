<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>document write function example</h2>
    <p>Using document.write() after an HTML document is loaded, will delete all existing HTML:</p>
    <p>like click the button</p>
    <button type="button" onclick="document.write(3+5)">click</button>
    <p>it will replace all the text with 8 as result of 3+5</p>
</body>
</html>
